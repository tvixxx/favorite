# Продовый стек: Postgres + NestJS + nginx (он же раздаёт собранный фронтенд).
# Всё за одним доменом — см. deploy/README.md.
#
#   cd deploy && docker compose up -d --build

name: favorite

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Мажорная версия должна совпадать с локальной (18.x): дамп pg_dump -Fc
    # со свежего сервера не восстановится на более старый
    image: postgres:18-alpine
    container_name: favorite-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # В образах 18+ PGDATA по умолчанию — /var/lib/postgresql/18/docker.
      # Фиксируем путь без номера версии: тогда при смене мажора Postgres
      # честно упадёт с «incompatible data directory», а не поднимет рядом
      # пустую базу
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Данные лежат на хосте, а не внутри контейнера: `docker compose down -v`
      # не должен уносить базу
      - ${DATA_DIR:-/srv/favorite/data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу НЕ публикуем: база доступна только внутри docker-сети
    expose:
      - "5432"

  # Одноразовый инструмент. CLI и его dev-зависимости не входят в runtime API.
  migrate:
    profiles: ["tools"]
    build:
      context: ../backend
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  backend:
    build:
      context: ../backend
    container_name: favorite-backend
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Все переменные ниже читаются через configService.getOrThrow: если какой-то
      # не будет, приложение не поднимется вообще (проверено на стенде)
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Один секрет на оба токена — refresh подписывается им же
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-2h}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-7d}
      # Пустое значение допустимо и означает host-only куку — то, что нужно
      # для схемы «всё на одном домене». Но переменная должна существовать
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # За одним доменом CORS не нужен, но переменные читаются кодом —
      # оставляем ровно свой origin, без звёздочки
      CORS_ORIGINS: https://${DOMAIN}
      FRONTEND_ORIGIN: https://${DOMAIN}
      MEDIA_STORAGE: s3
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?Configure media storage}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:?Configure media storage}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:?Configure media storage}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-ru-1}
      MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-true}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:?Configure media storage}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:?Configure media storage}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    expose:
      - "3005"

  web:
    build:
      context: ../frontend
      args:
        # Адреса «запекаются» в бандл на сборке: REST через /api,
        # сокет — на тот же origin
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    container_name: favorite-web
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Конфиг подключаем снаружи: правки не требуют пересборки образа.
      # Скрипты выбирают HTTP или игнорируемый сгенерированный HTTPS-конфиг.
      - ${NGINX_CONFIG:-./nginx/app.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_DIR:-/srv/favorite/data}/certbot/conf:/etc/letsencrypt:ro
      - ${DATA_DIR:-/srv/favorite/data}/certbot/www:/var/www/certbot
