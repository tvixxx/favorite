# Один домен на всё приложение: статика на /, API на /api, сокет на /socket.io.
# Так refresh-кука остаётся first-party и CORS не нужен вообще.
#
# Это HTTP-версия: работает сразу и обслуживает проверку Let's Encrypt.
# После получения сертификата подключите app-ssl.conf (см. deploy/README.md).

upstream backend {
  server backend:3005;
}

server {
  listen 80;
  server_name _;

  # ACME-проверка Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # --- API ---
  # Слэш в конце proxy_pass срезает префикс /api: наружу /api/movies,
  # в бэкенд уходит /movies. Глобального префикса в NestJS нет, менять код не нужно.
  location /api/ {
    proxy_pass http://backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # --- WebSocket (чат на Socket.IO, namespace /chat) ---
  location /socket.io/ {
    proxy_pass http://backend/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Долгие соединения не должны рваться по таймауту
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;
  }

  # --- статика ---
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Файлы с хешем в имени можно кешировать навсегда
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker кешировать нельзя: иначе PWA залипнет на старой версии
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA: любой маршрут отдаём index.html, роутинг разбирает Vue Router
  location / {
    try_files $uri $uri/ /index.html;
  }
}
